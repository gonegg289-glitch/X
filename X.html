<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictator Department</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    
    .marquee-text {
      color: #d9534f;
      font-size: 18px;
      font-weight: bold;
      background: #ffe6e6;
      padding: 8px;
      border-radius: 4px;
    }

    .container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .list-container, .form-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 280px;
    }

    ol#members-list li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Style for member avatar images */
    .member-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ccc;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <marquee class="marquee-text">Welcome to DUOS(Dicator union of Soviet)</marquee>

  <h1>DUOS Members</h1>

  <div class="container">
    <div class="list-container">
      <h3>DUOS Members</h3>
      <ol id="members-list">
        <li>
          <img src="https://i.pinimg.com/originals/c9/2a/a8/c92aa82a93ffb2d997bd03b90df78921.jpg" alt="BIBEK" class="member-avatar">
          <span>BIBEK</span>
        </li>
        <li>
          <img src="https://i.pinimg.com/originals/c9/2a/a8/c92aa82a93ffb2d997bd03b90df78921.jpg" alt="Abeil" class="member-avatar">
          <span>Abeil</span>
        </li>
        <li>
          <img src="https://i.pinimg.com/originals/c9/2a/a8/c92aa82a93ffb2d997bd03b90df78921.jpg" alt="Prasanna" class="member-avatar">
          <span>Prasanna</span>
        </li>
        <li>
          <img src="https://i.pinimg.com/originals/c9/2a/a8/c92aa82a93ffb2d997bd03b90df78921.jpg" alt="Anoyog" class="member-avatar">
          <span>Anoyog</span>
        </li>
        <li>
          <img src="https://i.pinimg.com/originals/c9/2a/a8/c92aa82a93ffb2d997bd03b90df78921.jpg" alt="RN SARU" class="member-avatar">
          <span>RN SARU</span>
        </li>
      </ol>
    </div>

    <div class="form-container">
      <h3>Add Yourself</h3>
      <form id="memberForm">
        <div class="form-group">
          <label for="username">Your Name / Email:</label>
          <input type="text" id="username" required placeholder="Enter your name or email">
        </div>
        <div class="form-group">
          <label for="photoUrl">Photo URL (optional):</label>
          <input type="url" id="photoUrl" placeholder="stalin.jpg">
        </div>
        <button type="submit">Join List</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('memberForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const userInput = document.getElementById('username').value.trim();
      const photoInput = document.getElementById('photoUrl').value.trim();
      const list = document.getElementById('members-list');

      if (!userInput) return;

      // Use photo from input or default to Stalin photo
      const photoSrc = photoInput || 'https://i.pinimg.com/originals/c9/2a/a8/c92aa82a93ffb2d997bd03b90df78921.jpg';

      // 1. Visually update the on-screen list
      const newItem = document.createElement('li');
      
      const img = document.createElement('img');
      img.src = photoSrc;
      img.alt = userInput;
      img.className = 'member-avatar';

      const nameSpan = document.createElement('span');
      nameSpan.textContent = userInput;

      newItem.appendChild(img);
      newItem.appendChild(nameSpan);
      list.appendChild(newItem);

      // 2. Transmit payload to server endpoint
      try {
        const response = await fetch('/api/add-member', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({ member: userInput, photoUrl: photoSrc })
        });

        if (response.ok) {
          console.log('Member successfully saved on server.');
        } else {
          console.warn('Server endpoint responded with an error status.');
        }
      } catch (error) {
        console.error('Network request failed:', error);
      }

      // 3. Clear inputs
      document.getElementById('username').value = '';
      document.getElementById('photoUrl').value = '';
      alert('Welcome, ' + userInput + '! Your name has been added.');
    });
  </script>
</body>
</html>
