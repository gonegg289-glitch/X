<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictator Department</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    .banner {
      background-color: #ffebee;
      color: #d32f2f;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      flex: 1;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
    }

    .member-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .member-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .member-item:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      border: 1px solid #ccc;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      background-color: #2e7d32;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>

  <div class="banner">
    Welcome to DUOS(Dicator union of Soviet)
  </div>

  <h1>DUOS Members</h1>

  <div class="container">
    <!-- Left Column: Member List -->
    <div class="card">
      <h2>DUOS Members</h2>
      <ul class="member-list">
        <!-- Stalin with Online Image Link -->
        <li class="member-item">
          <img class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Stalin_1942.jpg/480px-Stalin_1942.jpg" alt="Stalin">
          <span>Stalin</span>
        </li>
        <li class="member-item">
          <img class="avatar" src="bibek.jpg" alt="BIBEK">
          <span>BIBEK</span>
        </li>
        <li class="member-item">
          <img class="avatar" src="abeil.jpg" alt="Abeil">
          <span>Abeil</span>
        </li>
        <li class="member-item">
          <img class="avatar" src="prasanna.jpg" alt="Prasanna">
          <span>Prasanna</span>
        </li>
        <li class="member-item">
          <img class="avatar" src="anoyog.jpg" alt="Anoyog">
          <span>Anoyog</span>
        </li>
        <li class="member-item">
          <img class="avatar" src="rn_saru.jpg" alt="RN SARU">
          <span>RN SARU</span>
        </li>
      </ul>
    </div>

    <!-- Right Column: Form -->
    <div class="card">
      <h2>Add Yourself</h2>
      <form>
        <div class="form-group">
          <label for="name">Your Name / Email:</label>
          <input type="text" id="name" placeholder="Enter your name or email">
        </div>
        <div class="form-group">
          <label for="photo">Photo URL (optional):</label>
          <input type="text" id="photo" placeholder="https://example.com/photo.jpg">
        </div>
        <button type="submit" class="btn">Join List</button>
      </form>
    </div>
  </div>

</body>
</html>
